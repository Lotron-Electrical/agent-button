<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#0d0d0d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Agents</title>
<style>
  :root{
    --bg:#0d0d0d; --panel:#161616; --panel2:#1d1d1d; --line:#2a2a2a;
    --ink:#ece7e1; --dim:#8a847c; --accent:#C15F3C; --accent2:#e0794f; --ok:#5fb87a; --warn:#d9a84f; --err:#d9655a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%}
  body{
    background:radial-gradient(120% 80% at 50% -10%, #1a1411 0%, var(--bg) 55%);
    color:var(--ink); font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    min-height:100%; padding:max(18px,env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));
  }
  header{display:flex; align-items:center; gap:10px; margin-bottom:12px}
  .dot{width:10px; height:10px; border-radius:50%; background:var(--accent); box-shadow:0 0 12px var(--accent)}
  h1{font-size:17px; margin:0; letter-spacing:.5px; font-weight:600; flex:1}
  h1 span{color:var(--dim); font-weight:400}
  .spawnlink{font-size:13px; color:var(--accent2); text-decoration:none; border:1px solid var(--line); padding:7px 11px; border-radius:10px; white-space:nowrap}
  .spawnlink:active{background:var(--panel)}
  /* stats bar */
  .stats{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:11px 13px; margin-bottom:14px}
  .srow{display:flex; align-items:center; gap:10px; font-size:12px; margin:5px 0}
  .srow .lab{width:30px; color:var(--dim); letter-spacing:.4px}
  .srow .bar{flex:1; height:8px; background:var(--panel2); border-radius:6px; overflow:hidden}
  .srow .bar i{display:block; height:100%; border-radius:6px; background:linear-gradient(90deg,var(--accent2),var(--accent)); transition:width .4s}
  .srow .bar i.hot{background:linear-gradient(90deg,#d9a84f,#d9655a)}
  /* Sized by content, never wrapped: a fixed 96px broke "12.9 / 31.9 GB" onto two lines on the
     phone the moment the numbers grew a digit. The bar is the flexible part; the number is not. */
  .srow .val{flex:none; min-width:96px; text-align:right; color:var(--ink); white-space:nowrap}
  .shost{font-size:11px; color:var(--dim); margin-top:6px; display:flex; align-items:center; gap:6px}
  .shost .live{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .shost.off{color:var(--err)} .shost.off .live{background:var(--err);box-shadow:0 0 8px var(--err)}
  /* which Claude subscription these agents are burning */
  .acct{margin-top:9px; padding-top:9px; border-top:1px solid var(--line); font-size:11px; color:var(--dim); line-height:1.6}
  .acct .who{display:flex; align-items:center; gap:7px; flex-wrap:nowrap}
  .acct .pill, .acct .plan{flex:none; white-space:nowrap}
  .acct .mail{flex:1; min-width:0}
  .acct .pill{font-size:10px; font-weight:600; letter-spacing:.5px; text-transform:uppercase;
    color:var(--accent2); border:1px solid rgba(224,121,79,.45); background:rgba(224,121,79,.10); padding:2px 8px; border-radius:20px}
  .acct .mail{color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .acct .plan{color:var(--dim)}
  .acct .alt{margin-top:3px; opacity:.75}
  .sub{font-size:12px; color:var(--dim); margin:0 2px 14px; letter-spacing:.3px}
  /* usage: one card per account, one row per window: label | bar | value */
  .ucard{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:11px 13px; margin-bottom:12px}
  .ucard.active{border-color:rgba(224,121,79,.5)}
  .utitle{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; margin-bottom:6px}
  .utitle small{margin-left:auto; font-weight:400; font-size:11px; color:var(--dim); white-space:nowrap}
  .upill{font-size:10px; font-weight:600; letter-spacing:.5px; text-transform:uppercase; color:var(--accent2); border:1px solid rgba(224,121,79,.45); background:rgba(224,121,79,.10); padding:1px 7px; border-radius:20px}
  .urow{display:flex; align-items:center; gap:10px; font-size:12px; margin:6px 0}
  .ulab{width:78px; flex:none; color:var(--dim)}
  .urow .bar{flex:1; height:8px; background:var(--panel2); border-radius:6px; overflow:hidden}
  .urow .bar i{display:block; height:100%; border-radius:6px; background:linear-gradient(90deg,var(--accent2),var(--accent)); transition:width .4s}
  .urow .bar i.hot{background:linear-gradient(90deg,#d9a84f,#d9655a)}
  .uval{flex:none; min-width:44px; text-align:right; color:var(--ink); white-space:nowrap; display:flex; flex-direction:column; align-items:flex-end; line-height:1.25}
  .uval.wide{flex:1}
  .uval small{font-size:10px; color:var(--dim); font-weight:400}
  .unote{font-size:12px; color:var(--dim); padding:4px 0}
  /* cards */
  a.card{
    display:block; text-decoration:none; color:inherit; position:relative;
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px;
  }
  a.card:active{border-color:var(--accent)}
  .top{display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .name{font-size:16px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1}
  .badge{font-size:11px; padding:3px 9px; border-radius:20px; letter-spacing:.4px; text-transform:uppercase; font-weight:600; white-space:nowrap}
  .badge.busy{color:#1a0f0a; background:var(--accent); animation:pulse 1.6s ease-in-out infinite}
  .badge.idle{color:var(--ok); background:rgba(95,184,122,.14); border:1px solid rgba(95,184,122,.35)}
  .badge.err{color:var(--err); background:rgba(217,101,90,.14); border:1px solid rgba(217,101,90,.4)}
  .badge.other{color:var(--dim); background:var(--panel2); border:1px solid var(--line)}
  .close{width:30px; height:30px; flex:none; border-radius:8px; border:1px solid var(--line); background:var(--panel2);
         color:var(--dim); font-size:17px; line-height:1; display:flex; align-items:center; justify-content:center; padding:0}
  .close:active{background:rgba(217,101,90,.18); color:var(--err); border-color:var(--err)}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(193,95,60,.5)}50%{box-shadow:0 0 0 6px rgba(193,95,60,0)}}
  .meta{font-size:12px; color:var(--dim); margin-bottom:12px; line-height:1.5; word-break:break-all}
  .snote{font-size:13px; color:var(--ink); line-height:1.45; margin:2px 0 6px; padding-left:9px;
    border-left:2px solid var(--accent); overflow-wrap:anywhere}
  .chatbtn{display:block; text-align:center; padding:12px; border-radius:11px; font-size:15px; font-weight:600;
        color:#1a0f0a; background:linear-gradient(135deg,var(--accent2),var(--accent)); box-shadow:0 6px 18px rgba(193,95,60,.3)}
  /* .chatbtn is also used on a real <a> (the bridge chat action), so pin the dark label against
     the bright fill with link-state specificity and kill the UA underline. */
  a.chatbtn, a.chatbtn:link, a.chatbtn:visited{color:#1a0f0a; text-decoration:none}
  .extsecond{margin-top:8px}
  .empty{text-align:center; color:var(--dim); font-size:14px; line-height:2; margin-top:50px}
  .empty a{color:var(--accent2)}
  .seclabel{font-size:11px; color:var(--dim); letter-spacing:.6px; text-transform:uppercase; margin:20px 4px 10px; border-top:1px solid var(--line); padding-top:14px}
  .extcard{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px}
  /* finished relays fold under one tappable line */
  details.past summary{cursor:pointer; list-style:none; display:flex; align-items:center; gap:8px; -webkit-tap-highlight-color:transparent}
  details.past summary::-webkit-details-marker{display:none}
  details.past summary::before{content:'▸'; color:var(--accent2); font-size:12px}
  details.past[open] summary::before{content:'▾'}
  .extlink{display:block; text-align:center; padding:11px; border-radius:11px; font-size:14px; font-weight:600; color:var(--accent2); border:1px solid var(--line); background:var(--panel2); text-decoration:none}
  .srelay{display:block; width:100%; margin-top:10px; padding:11px; border-radius:11px; font:inherit; font-size:14px; font-weight:600; cursor:pointer; border:1px solid var(--line); background:var(--panel2); text-align:center}
  .srelay.stop{color:var(--err)} .srelay.cont{color:var(--accent2)}
  .srelay:active{filter:brightness(1.15)} .srelay[disabled]{opacity:.5}
  .extlink:active{border-color:var(--accent)}
  .extnochat{text-align:center; padding:8px; font-size:12px; color:var(--dim)}
  /* "Connect RC": turn remote control on for a terminal that has no bridge yet */
  .rcarm{display:block; width:100%; padding:11px; border-radius:11px; font:inherit; font-size:14px; font-weight:600;
    cursor:pointer; text-align:center; color:var(--accent2); border:1px solid rgba(224,121,79,.45); background:rgba(224,121,79,.10)}
  .rcarm:active{filter:brightness(1.2)}
  .rcarm[disabled]{opacity:.65; cursor:default}
  .rcarm.workin{color:var(--warn); border-color:rgba(217,168,79,.45); background:rgba(217,168,79,.10)}
  .rcarm.bad{color:var(--err); border-color:rgba(217,101,90,.45); background:rgba(217,101,90,.10)}
  .rcwhy{font-size:11px; color:var(--dim); text-align:center; margin-top:6px; line-height:1.45; overflow-wrap:anywhere}
  /* Agents as a GRID that fits the screen, not a list that scrolls. Two columns, rows share the
     height that is left under the header, so every agent is on screen at once and one tap opens
     it. The tile says the name and one status word; nothing else. */
  body.gridview{display:flex; flex-direction:column; height:100dvh; min-height:0; overflow:hidden}
  body.gridview header{flex:none}
  body.gridview #sub{display:none}
  body.gridview .stats{flex:none; margin-bottom:10px}
  .stats.compact{padding:8px 12px}
  .stats.compact .srow{margin:3px 0}
  .stats.compact .shost{margin-top:4px}
  body.gridview #ext{flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:1fr; gap:12px; padding:4px 0}
  body.gridview #ext:empty{display:none}
  .tile{position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center;
        border-radius:16px; border:1px solid var(--line); background:var(--panel); color:var(--ink); text-decoration:none;
        padding:12px; min-height:0; overflow:hidden; font:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent}
  .tile:link, .tile:visited{color:var(--ink)}
  .tile:active{border-color:var(--accent); background:var(--panel2)}
  .tile .tname{font-size:15px; font-weight:600; line-height:1.3; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
  .tile .tstate{font-size:11px; letter-spacing:.5px; text-transform:uppercase; color:var(--dim)}
  /* Colour is the state, read from across the room: GREEN working, RED idle, ORANGE not connected. */
  .tile.busy{border-color:rgba(95,184,122,.6); background:rgba(95,184,122,.10)}
  .tile.busy .tstate, .tile.busy .rcdot{color:var(--ok)}
  .tile.busy .rcdot{background:var(--ok); box-shadow:0 0 8px var(--ok)}
  .tile.idle, .tile.waiting{border-color:rgba(217,101,90,.6); background:rgba(217,101,90,.10)}
  .tile.idle .tstate, .tile.waiting .tstate{color:var(--err)}
  .tile.idle .rcdot, .tile.waiting .rcdot{background:var(--err); box-shadow:0 0 8px var(--err)}
  .tile.off{border-color:rgba(224,121,79,.6); background:rgba(224,121,79,.10); border-style:dashed}
  .tile.off .tstate{color:var(--accent2)}
  .tile.off .rcdot{background:var(--accent2); box-shadow:0 0 8px var(--accent2)}
  .tile .rcdot{position:absolute; top:10px; right:10px; width:8px; height:8px; border-radius:50%}
  .tile.arming .tstate{color:var(--warn)}
  .tile.failed .tstate{color:var(--err)}
  /* remote-control state, at a glance, on every terminal card */
  .rcpill{font-size:10px; font-weight:600; letter-spacing:.5px; text-transform:uppercase; padding:3px 8px; border-radius:20px; white-space:nowrap}
  .rcpill.on{color:var(--ok); border:1px solid rgba(95,184,122,.35); background:rgba(95,184,122,.12)}
  .rcpill.off{color:var(--dim); border:1px solid var(--line); background:var(--panel2)}
  /* The chat opens IN this page: a full-height sheet over the list, so the dashboard and the
     conversation are one screen and the list is one swipe-down away. */
  #sheet{position:fixed; inset:0; z-index:50; display:none; flex-direction:column; background:var(--bg)}
  #sheet.open{display:flex}
  /* The chat page brings its own header (name, live status, back, Claude link), so this bar is
     kept only as the close target the back gesture and the iframe's ‹ post to. Two headers
     stacked was a wasted 60px of phone. */
  #sheet .bar{display:none; flex:none; align-items:center; gap:10px; padding:calc(8px + env(safe-area-inset-top)) 12px 8px; border-bottom:1px solid var(--line); background:linear-gradient(180deg,#1a1411,#0d0d0d)}
  #sheet .bar .sname{flex:1; font-size:15px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  #sheet .bar button{font:inherit; font-size:13px; color:var(--accent2); background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:7px 12px}
  #sheet iframe{flex:1; border:0; width:100%; background:var(--bg)}
  .foot{text-align:center; color:var(--dim); font-size:11px; margin-top:18px; opacity:.7}
</style>
</head>
<body>
  <header>
    <div class="dot"></div>
    <h1><a id="hometitle" href="__START__" style="color:inherit;text-decoration:none">AGENTS</a> <span>// your PC</span></h1>
    <a class="spawnlink" href="__START__/new">+ New</a>
  </header>
  <div class="stats" id="stats" style="display:none"></div>
  <div class="sub" id="sub">loading…</div>
  <!-- Chats first: the terminal agents and in-app agents are what Lloyd opens this page to talk
       to. Solve relays are history most of the time, so they sit underneath. -->
  <div class="seclabel" id="extlabel" style="display:none;margin-top:4px;border-top:none;padding-top:0">Terminal agents · tap to chat</div>
  <div id="ext"></div>
  <div id="list"></div>
  <div id="solveswrap"></div>
  <div id="sheet" aria-hidden="true">
    <div class="bar"><button id="sheetclose" type="button">‹ Agents</button><span class="sname" id="sheetname"></span></div>
    <iframe id="sheetframe" title="agent chat"></iframe>
  </div>

<script>
const SECRET = "__SECRET__";
const START = "__START__";
const $ = (id) => document.getElementById(id);
// Self-refresh on deploy: the relay reports its build stamp on every poll; a new stamp means new
// pages, so reload rather than keep running yesterday's code on the phone.
let BUILD_SEEN = null;
function bumped(b){ if(!b) return false; if(BUILD_SEEN===null){ BUILD_SEEN=b; return false; } if(b!==BUILD_SEEN){ location.reload(); return true; } return false; }
const VIEW = new URLSearchParams(location.search).get('view') || 'agents';   // agents | relays | account
$('hometitle').textContent = VIEW.toUpperCase();
document.title = VIEW.charAt(0).toUpperCase() + VIEW.slice(1);
if (VIEW !== 'agents') $('sub').textContent = '';
if (VIEW === 'agents') document.body.classList.add('gridview');

function api(p, opts){ return fetch(p, { ...(opts||{}), headers: { Authorization: 'Bearer ' + SECRET, ...((opts&&opts.headers)||{}) } }); }
function ago(ts){ if(!ts) return ''; let s=Math.max(0,Math.round((Date.now()-ts)/1000)); if(s<60)return s+'s'; if(s<3600)return Math.round(s/60)+'m'; return Math.round(s/3600)+'h'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function shortCwd(c){ if(!c) return ''; return c.replace(/^[A-Za-z]:\\Users\\[^\\]+/, '~').replace(/^\/[a-z]\/Users\/[^/]+/i,'~').replace(/\\/g,'/'); }
function statusInfo(s){ s=String(s||'').toLowerCase(); if(s==='thinking'||s==='busy')return{label:'working',cls:'busy'}; if(s==='idle')return{label:'idle',cls:'idle'}; if(s==='live')return{label:'live',cls:'idle'}; if(s==='solved')return{label:'solved',cls:'idle'}; if(s==='error')return{label:'error',cls:'err'}; return{label:s||'new',cls:'other'}; }

function renderStats(st, compact){
  const el = $('stats');
  if(!st || !st.ts){ el.style.display='none'; return; }
  el.style.display='block';
  el.classList.toggle('compact', !!compact);
  if (compact) {
    // Two bars and the host line, nothing else: the grid below needs the height.
    const cpu = Math.max(0,Math.min(100, st.cpuPct||0)), ram = Math.max(0,Math.min(100, st.ramPct||0));
    const fresh = (Date.now()-st.ts) < 20000;
    el.innerHTML =
      '<div class="srow"><span class="lab">CPU</span><div class="bar"><i class="'+(cpu>85?'hot':'')+'" style="width:'+cpu+'%"></i></div><span class="val">'+cpu+'%</span></div>'+
      '<div class="srow"><span class="lab">RAM</span><div class="bar"><i class="'+(ram>88?'hot':'')+'" style="width:'+ram+'%"></i></div><span class="val">'+(st.ramUsedGB||0)+' / '+(st.ramTotalGB||0)+' GB</span></div>'+
      '<div class="shost'+(fresh?'':' off')+'"><span class="live"></span>'+esc(st.host||'PC')+(fresh?' · online':' · last seen '+ago(st.ts)+' ago')+(st.uptimeH?' · up '+st.uptimeH+'h':'')+'</div>';
    return;
  }
  const fresh = (Date.now()-st.ts) < 20000;
  const cpu = Math.max(0,Math.min(100, st.cpuPct||0));
  const ram = Math.max(0,Math.min(100, st.ramPct||0));
  el.innerHTML =
    '<div class="srow"><span class="lab">CPU</span><div class="bar"><i class="'+(cpu>85?'hot':'')+'" style="width:'+cpu+'%"></i></div><span class="val">'+cpu+'%'+(st.cores?' · '+st.cores+'c':'')+'</span></div>'+
    '<div class="srow"><span class="lab">RAM</span><div class="bar"><i class="'+(ram>88?'hot':'')+'" style="width:'+ram+'%"></i></div><span class="val">'+(st.ramUsedGB||0)+' / '+(st.ramTotalGB||0)+' GB</span></div>'+
    '<div class="shost'+(fresh?'':' off')+'"><span class="live"></span>'+esc(st.host||'PC')+(fresh?' · online '+ago(st.ts)+' ago':' · last seen '+ago(st.ts)+' ago')+(st.uptimeH?' · up '+st.uptimeH+'h':'')+'</div>'+
    accountHtml(st.account);
}

// Which Claude subscription every agent on this PC is signed in as. It matters because the PC
// rotates between four captured accounts, and "why is it rate limited" is unanswerable from the
// phone without knowing which one is live right now.
function planLabel(a){
  const plan = (a.plan||'').toLowerCase();
  const nice = plan ? plan.charAt(0).toUpperCase()+plan.slice(1) : '';
  // "default_claude_max_20x" -> "20x"
  const m = /(\d+)\s*x/i.exec(a.tier||'');
  return [nice, m ? m[1]+'x' : ''].filter(Boolean).join(' ');
}
// ---- usage: rate-limit windows and token counts, as label / bar / value rows ----
function fmtTok(n){ n=+n||0; if(n>=1e9) return (n/1e9).toFixed(1)+'B'; if(n>=1e6) return (n/1e6).toFixed(1)+'M'; if(n>=1e3) return Math.round(n/1e3)+'k'; return String(n); }
function until(ts){ if(!ts) return ''; const ms=(typeof ts==='number'?ts:Date.parse(ts))-Date.now(); if(!(ms>0)) return 'now'; const h=Math.floor(ms/3600000), m=Math.round((ms%3600000)/60000); return h>=48 ? Math.round(h/24)+'d' : (h? h+'h '+m+'m' : m+'m'); }
function limitLabel(k){ return ({session:'5 hour', weekly_all:'7 day', weekly_scoped:'7 day Opus', primary:'5 hour', secondary:'7 day'})[k] || k; }
function barRow(label, pct, right){
  const p = pct==null ? null : Math.max(0,Math.min(100,pct));
  const hot = p!=null && p>=85;
  return '<div class="urow"><span class="ulab">'+esc(label)+'</span>'+
    '<div class="bar"><i class="'+(hot?'hot':'')+'" style="width:'+(p==null?0:p)+'%"></i></div>'+
    '<span class="uval">'+(p==null?'–':p+'%')+(right?'<small>'+esc(right)+'</small>':'')+'</span></div>';
}
function limitsRows(limits){
  const rows = (limits||[]).filter(l => l && (l.kind==='session'||l.kind==='weekly_all'||l.kind==='weekly_scoped'||l.kind==='primary'||l.kind==='secondary'));
  if(!rows.length) return '<div class="unote">no limit data yet</div>';
  return rows.map(l => barRow(limitLabel(l.kind), l.percent, l.resetsAt ? 'resets '+until(l.resetsAt) : '')).join('');
}
function tokensHtml(t){
  if(!t) return '';
  const row = (lab, v) => v ? '<div class="urow"><span class="ulab">'+lab+'</span><span class="uval wide">'+fmtTok(v.in+v.out)+'<small>'+fmtTok(v.in)+' in · '+fmtTok(v.out)+' out</small></span></div>' : '';
  return '<div class="ucard"><div class="utitle">Tokens</div>'+row('5 hour', t.fiveHour)+row('Today', t.today)+row('Week', t.week)+
    (t.burnPerMin ? '<div class="urow"><span class="ulab">Burn</span><span class="uval wide">'+fmtTok(t.burnPerMin)+'<small>per minute</small></span></div>' : '')+'</div>';
}
// The connected account's own windows, shown under the account line on the Account screen.
function activeUsageHtml(u){
  if(!u || !u.accounts) return '';
  const a = u.accounts.find(x => x.active);
  if(!a) return '';
  return '<div class="ucard"><div class="utitle">Limits'+(a.error?'<small>'+esc(a.error)+'</small>':'')+'</div>'+limitsRows(a.limits)+'</div>'+tokensHtml(u.tokens);
}
// The Usage screen: every Claude account, then Codex.
function renderUsage(st){
  const u = st && st.usage;
  const el = $('list');
  if(!u){ el.innerHTML = '<div class="unote">usage widget is not running on the PC</div>'; return; }
  let h = '';
  for (const a of (u.accounts||[])) {
    h += '<div class="ucard'+(a.active?' active':'')+'"><div class="utitle">'+esc(a.name||a.email)+(a.active?'<span class="upill">connected</span>':'')+
         (a.burnPerMin?'<small>'+fmtTok(a.burnPerMin)+'/min</small>':'')+'</div>'+limitsRows(a.limits)+
         (a.error&&!a.limits?'<div class="unote">'+esc(a.error)+'</div>':'')+'</div>';
  }
  if (u.codex) {
    h += '<div class="ucard"><div class="utitle">Codex'+(u.codex.planType?'<span class="upill">'+esc(u.codex.planType)+'</span>':'')+'</div>'+
         ((u.codex.limits||[]).length ? u.codex.limits.map(l => barRow(l.windowMinutes>=10000?'7 day':(l.windowMinutes>=240?'5 hour':l.windowMinutes+' min'), l.percent, l.resetsAt?'resets '+until(l.resetsAt):'')).join('') : '<div class="unote">no limit data yet</div>')+'</div>';
  }
  h += tokensHtml(u.tokens);
  el.innerHTML = h;
}
function accountHtml(a){
  if(!a || (!a.email && !a.plan)) return '';
  const plan = planLabel(a);
  const alt = (a.others||[]).map(o=>o.name).filter(Boolean);
  return '<div class="acct"><div class="who">'+
    (a.profile ? '<span class="pill">'+esc(a.profile)+'</span>' : '')+
    '<span class="mail">'+esc(a.email||'unknown account')+'</span>'+
    (plan ? '<span class="plan">· '+esc(plan)+'</span>' : '')+
    '</div>'+
    (alt.length ? '<div class="alt">also captured: '+esc(alt.join(', '))+'</div>' : '')+
    '</div>';
}

// The agents screen: every agent is a tile, all tiles fit the screen, one tap opens the chat.
// A tile with no bridge is dashed and its tap connects remote control instead.
function tileState(a, arm){
  const st = String(a.status||'').toLowerCase();
  if (!a.bridgeSessionId) {
    const s = arm && arm.state;
    if (s==='queued' || s==='arming' || s==='ok') return { cls:'off arming', word:'connecting', act:'none' };
    if (s==='fail') return { cls:'off failed', word:'retry', act:'arm' };
    return { cls:'off', word:'connect', act:'arm' };
  }
  if (st==='busy'||st==='thinking') return { cls:'busy', word:'working', act:'chat' };
  if (st==='waiting') return { cls:'waiting', word:'waiting', act:'chat' };
  return { cls:'idle', word: st||'live', act:'chat' };
}
// Names you gave agents from the phone. Keyed by bridge id when there is one (survives a tab
// rename), else by tab title. Long-press a tile to rename it.
let ALIASES = {};
const aliasKey = (a) => a.bridgeSessionId || ('tab:' + a.name);
const shown = (a) => ALIASES[aliasKey(a)] || a.name;
function renderGrid(external, agents, rcarm){
  const tiles = external.map(a => {
    const t = tileState(a, (rcarm||{})[a.name]);
    const label = shown(a);
    const inner = '<span class="rcdot"></span><span class="tname">'+esc(label)+'</span><span class="tstate">'+esc(t.word)+'</span>';
    const keyAttr = ' data-key="'+esc(aliasKey(a))+'" data-label="'+esc(label)+'"';
    if (t.act==='chat') {
      const url = START+'/rc?id='+encodeURIComponent(a.bridgeSessionId)+'&name='+encodeURIComponent(label);
      return '<a class="tile openchat '+t.cls+'" href="'+url+'" data-name="'+esc(label)+'"'+keyAttr+'>'+inner+'</a>';
    }
    if (t.act==='arm') return '<button type="button" class="tile rcarm '+t.cls+'" data-tab="'+esc(a.name)+'"'+keyAttr+'>'+inner+'</button>';
    return '<div class="tile '+t.cls+'"'+keyAttr+'>'+inner+'</div>';
  }).concat(agents.map(a => {
    // in-app (headless) agents sit in the same grid; their chat page opens in the sheet too
    const st = statusInfo(a.status);
    return '<a class="tile openchat '+(st.cls==='busy'?'busy':'idle')+'" href="'+START+'/chat?id='+encodeURIComponent(a.id)+'" data-name="'+esc(a.title||a.id)+'"><span class="tname">'+esc(a.title||a.id)+'</span><span class="tstate">'+esc(st.label)+'</span></a>';
  }));
  $('extlabel').style.display = 'none';
  $('list').innerHTML = '';
  $('ext').innerHTML = tiles.length ? tiles.join('') : '<a class="tile" href="'+START+'/new"><span class="tname">New agent</span></a>';
}

// A terminal with no bridgeSessionId cannot be chatted with from anywhere — not here, not in
// the Claude app. Rather than showing a dead card, offer the fix: arming types `/rc <name>`
// into that tab on the PC and the session comes back with a bridge a few seconds later.
function armHtml(name, arm){
  const st = arm && arm.state;
  if(st==='queued')  return '<button class="rcarm workin" disabled>connecting…</button>';
  if(st==='arming')  return '<button class="rcarm workin" disabled>typing /rc in the tab…</button>';
  if(st==='fail')    return '<button class="rcarm bad" data-tab="'+esc(name)+'">Retry remote control</button>'+
                            (arm.detail ? '<div class="rcwhy">'+esc(arm.detail)+'</div>' : '');
  if(st==='ok')      return '<button class="rcarm workin" disabled>connected · waiting for the bridge…</button>';
  return '<button class="rcarm" data-tab="'+esc(name)+'">Connect remote control</button>';
}
function renderExternal(external, rcarm){
  if(!external || !external.length){ $('extlabel').style.display='none'; $('ext').innerHTML=''; return; }
  $('extlabel').style.display='block';
  $('ext').innerHTML = external.map(a => {
    const st = statusInfo(a.status);
    const meta = [shortCwd(a.cwd), a.waitingFor ? ('waiting · '+a.waitingFor) : ''].filter(Boolean).join(' · ');
    // In-app chat is the primary action wherever the bridge can address the session. The
    // claude.ai link stays as the permanent fallback for when that private API moves under us.
    const claudeLink = (cls) => '<a class="'+cls+'" href="'+esc(a.chat)+'" target="_blank" rel="noopener">Open in Claude ↗</a>';
    const rcUrl = START+'/rc?id='+encodeURIComponent(a.bridgeSessionId||'')+'&name='+encodeURIComponent(a.name||'');
    const action = a.bridgeSessionId
      ? '<a class="chatbtn openchat" href="'+rcUrl+'" data-name="'+esc(a.name||'')+'">Chat here ›</a>'
        + (a.chat ? claudeLink('extlink extsecond') : '')
      : armHtml(a.name, (rcarm||{})[a.name]);
    const rc = a.bridgeSessionId ? '<span class="rcpill on">RC on</span>' : '<span class="rcpill off">RC off</span>';
    return '<div class="extcard"><div class="top"><span class="name">'+esc(a.name)+'</span>'+rc+'<span class="badge '+st.cls+'">'+esc(st.label)+'</span></div>'+(meta?'<div class="meta">'+esc(meta)+'</div>':'')+action+'</div>';
  }).join('');
}

// Chat opens in the sheet, over this list, instead of navigating away. The href stays real so
// a long-press / open-in-new-tab still works and so nothing breaks if the sheet ever fails.
const sheet = $('sheet'), frame = $('sheetframe');
function openChat(url, name){
  $('sheetname').textContent = name || '';
  frame.src = url;
  sheet.classList.add('open'); sheet.setAttribute('aria-hidden','false');
  document.body.style.overflow = 'hidden';
  history.pushState({ chat: 1 }, '');
}
function closeChat(){
  if (!sheet.classList.contains('open')) return;
  sheet.classList.remove('open'); sheet.setAttribute('aria-hidden','true');
  document.body.style.overflow = '';
  setTimeout(() => { frame.src = 'about:blank'; }, 150);   // drop the long-poll once hidden
}
$('sheetclose').addEventListener('click', () => { if (history.state && history.state.chat) history.back(); else closeChat(); });
window.addEventListener('popstate', closeChat);            // the phone back gesture closes it
window.addEventListener('message', (ev) => { if (ev.data === 'rc-close') $('sheetclose').click(); });

// Long-press a tile to rename it. The press is detected by hand (600ms, no movement) because a
// phone's native long-press on a link opens the context menu, which is swallowed below.
let pressTimer = null, pressed = null, renamed = false;
function armPress(el){ clearTimeout(pressTimer); pressed = el; renamed = false; pressTimer = setTimeout(() => { renamed = true; renameTile(el); }, 600); }
function cancelPress(){ clearTimeout(pressTimer); pressTimer = null; }
async function renameTile(el){
  const key = el.dataset.key; if (!key) return;
  const cur = el.dataset.label || '';
  const name = prompt('Name this agent', cur);
  if (name === null) return;
  const trimmed = name.trim();
  if (trimmed) ALIASES[key] = trimmed; else delete ALIASES[key];
  refresh();
  try { await api('/alias', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ key, name: trimmed }) }); } catch(_){}
}
$('ext').addEventListener('pointerdown', (e) => { const t = e.target.closest('.tile'); if (t && t.dataset.key) armPress(t); });
$('ext').addEventListener('pointerup', cancelPress);
$('ext').addEventListener('pointercancel', cancelPress);
$('ext').addEventListener('pointermove', (e) => { if (pressTimer && (Math.abs(e.movementX) + Math.abs(e.movementY)) > 6) cancelPress(); });
$('ext').addEventListener('contextmenu', (e) => { if (e.target.closest('.tile')) e.preventDefault(); });

$('ext').addEventListener('click', async (e) => {
  if (renamed) { renamed = false; e.preventDefault(); return; }   // the long-press already handled this touch
  const chat = e.target.closest('.openchat');
  if (chat) { e.preventDefault(); openChat(chat.getAttribute('href'), chat.dataset.name); return; }
  const btn = e.target.closest('.rcarm');
  if (!btn || btn.disabled) return;
  const tab = btn.dataset.tab;
  if (!tab) return;
  btn.disabled = true; btn.className = 'rcarm workin'; btn.textContent = 'connecting…';
  try { await api('/rc/arm', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ tab }) }); }
  catch(err){ btn.className = 'rcarm bad'; btn.textContent = 'could not reach the relay'; return; }
  refresh();
});
function renderSolves(solves){
  if(!solves || !solves.length){ $('solveswrap').innerHTML=''; return; }
  // Only a relay that is still working earns a card up here. Solved and stopped ones are
  // history: keep them reachable (Resume, remove) but folded away under one line.
  const live = solves.filter(s => s.status!=='solved' && s.status!=='stopped');
  const past = solves.filter(s => s.status==='solved' || s.status==='stopped');
  const card = (s)=>{
    const gen = (s.dispatch?'⚡ lean · ':'')+'∞ generation '+(s.generation||1);
    let st, line, actions='';
    if(s.status==='solved'){ st={label:'solved',cls:'idle'}; line=gen+(s.summary?' · '+s.summary:''); }
    else if(s.status==='stopped'){ st={label:'stopped',cls:'other'}; line=gen+' · stopped'; actions='<button class="srelay cont" data-id="'+esc(s.id)+'">Resume ›</button>'; }
    else { st={label:'solving',cls:'busy'}; line=gen+(s.autoContinues?' · '+s.autoContinues+' auto-continued':'')+(s.lastBeat?' · beat '+ago(s.lastBeat)+' ago':'')+((s.wants&&s.wants.need)?' · 💡 would help (optional): '+s.wants.need:''); actions='<button class="srelay stop" data-id="'+esc(s.id)+'">Stop relay</button>'; }
    // The beat note goes ABOVE the meta line and in ink, not dim: on a multi-day relay it is the
    // only thing on the card that says what is actually happening. Everything else is liveness.
    const note = (s.note && s.note.text) ? '<div class="snote">'+esc(s.note.text)+'</div>' : '';
    return '<div class="extcard"><div class="top"><span class="name">'+esc(s.title||s.id)+'</span><span class="badge '+st.cls+'">'+esc(st.label)+'</span><button class="close sdel" data-id="'+esc(s.id)+'" aria-label="remove relay">✕</button></div>'+note+'<div class="meta">'+esc(line)+'</div>'+actions+'</div>';
  };
  // Remember whether the past list was open, so the 3s refresh does not snap it shut.
  const el = document.getElementById('pastsolves');
  const wasOpen = el ? el.open : VIEW === 'relays';   // on the Relays screen the history starts open
  $('solveswrap').innerHTML =
    (live.length ? '<div class="seclabel">Solve relays · working now</div>' + live.map(card).join('') : '') +
    (past.length ? '<details id="pastsolves" class="past"'+(wasOpen?' open':'')+'><summary class="seclabel">Past relays · '+past.length+' solved or stopped</summary>'+past.map(card).join('')+'</details>' : '');
}
function render(agents, hasExternal){
  // The empty card is only honest when there is nothing to talk to at all.
  if(!agents.length){ $('list').innerHTML = hasExternal ? '' : '<div class="empty">No agents yet.<br>Start one and chat with it right here.<br><a href="'+START+'">New agent →</a></div>'; return; }
  $('list').innerHTML = agents.map(a => {
    const st = statusInfo(a.status);
    const endlessTag = a.mode==='endless' ? ('∞ endless'+(a.status==='thinking'?' · turn '+(a.turns||0):'')) : '';
    const meta = [endlessTag, shortCwd(a.cwd), (a.msgCount ? a.msgCount+' msg' : ''), a.lastActivity ? 'active '+ago(a.lastActivity)+' ago' : ''].filter(Boolean).join(' · ');
    return '<a class="card" href="'+START+'/chat?id='+encodeURIComponent(a.id)+'">'+
           '<div class="top"><span class="name">'+esc(a.title||a.id)+'</span>'+
           '<span class="badge '+st.cls+'">'+esc(st.label)+'</span>'+
           '<button class="close" data-id="'+esc(a.id)+'" aria-label="close agent">✕</button></div>'+
           (meta ? '<div class="meta">'+esc(meta)+'</div>' : '')+
           '<span class="chatbtn">Open chat ›</span></a>';
  }).join('');
}

$('list').addEventListener('click', async (e) => {
  const btn = e.target.closest('.close');
  if (!btn) return;
  e.preventDefault(); e.stopPropagation();
  const id = btn.dataset.id;
  if (!confirm('Close this agent? Its chat will be removed.')) return;
  btn.textContent = '·'; btn.disabled = true;
  try { await api('/chat/close', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id }) }); } catch(e){}
  refresh();
});

$('solveswrap').addEventListener('click', async (e) => {
  const del = e.target.closest('.sdel');
  if (del) {
    const id = del.dataset.id;
    if (!confirm('Remove this relay from the list?')) return;
    del.disabled = true; del.textContent = '·';
    try { await api('/solve/delete', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ solveId: id }) }); } catch(e){}
    return refresh();
  }
  const btn = e.target.closest('.srelay');
  if (!btn) return;
  const id = btn.dataset.id;
  const stop = btn.classList.contains('stop');
  if (stop && !confirm('Stop this relay? It will not spawn another generation. Close its terminal window separately if one is open.')) return;
  if (!stop && !confirm('Resume this stopped relay?')) { return; }
  btn.disabled = true; btn.textContent = stop ? 'stopping…' : 'resuming…';
  try { await api(stop ? '/solve/stop' : '/solve/next', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ solveId: id, force: true }) }); } catch(e){}
  refresh();
});

async function refresh(){
  let data;
  try { data = await (await api('/agents')).json(); }
  catch(e){ $('sub').textContent = 'can’t reach relay'; return; }
  if (bumped(data.build)) return;
  ALIASES = data.aliases || {};
  const agents = data.agents || [];
  const external = data.external || [];
  // The count covers everything on the page you can talk to, terminal tabs included.
  const total = agents.length + external.length;
  const working = agents.filter(a => (a.status==='thinking'||a.status==='busy')).length
                + external.filter(a => (a.status==='busy'||a.status==='thinking')).length;
  // One section per screen. The home page links here with ?view=agents|relays|account and
  // this page shows only that section, so nothing on screen competes with what was tapped.
  if (VIEW === 'account') { renderStats(data.stats); $('list').innerHTML = activeUsageHtml(data.stats && data.stats.usage); $('sub').textContent = ''; return; }
  if (VIEW === 'usage')   { renderUsage(data.stats); $('sub').textContent = ''; return; }
  if (VIEW === 'relays')  { renderSolves(data.solves || []); $('sub').textContent = ''; return; }
  $('sub').innerHTML = total+' agent'+(total===1?'':'s')+(working?' · '+working+' working':'');
  renderStats(data.stats, true);                  // PC stats strip above the grid, compact
  renderGrid(external, agents, data.rcarm || {});
}
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
