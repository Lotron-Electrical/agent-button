<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#0d0d0d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Agents" />
<link rel="manifest" href="__START__/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<title>New Agent</title>
<style>
  :root{
    --bg:#0d0d0d; --panel:#161616; --panel2:#1d1d1d; --line:#2a2a2a;
    --ink:#ece7e1; --dim:#8a847c; --accent:#C15F3C; --accent2:#e0794f; --ok:#5fb87a; --err:#d9655a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%}
  body{
    background:radial-gradient(120% 80% at 50% -10%, #1a1411 0%, var(--bg) 55%);
    color:var(--ink); font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    display:flex; flex-direction:column; min-height:100%;
    padding:max(18px,env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
  }
  header{display:flex; align-items:center; gap:10px; margin-bottom:18px}
  .dot{width:10px; height:10px; border-radius:50%; background:var(--accent); box-shadow:0 0 12px var(--accent)}
  h1{font-size:17px; margin:0; letter-spacing:.5px; font-weight:600; flex:1}
  h1 span{color:var(--dim); font-weight:400}
  .navlink{font-size:13px; color:var(--accent2); text-decoration:none; border:1px solid var(--line); padding:7px 11px; border-radius:10px; white-space:nowrap}
  .navlink:active{background:var(--panel)}
  label{display:block; font-size:12px; color:var(--dim); margin:0 0 7px 2px; letter-spacing:.4px; text-transform:uppercase}
  textarea{
    width:100%; min-height:150px; resize:vertical; background:var(--panel); color:var(--ink);
    border:1px solid var(--line); border-radius:14px; padding:14px; font:inherit; font-size:16px; line-height:1.45;
    outline:none; transition:border-color .15s;
  }
  textarea:focus{border-color:var(--accent)}
  details{margin-top:16px; border:1px solid var(--line); border-radius:12px; background:var(--panel); overflow:hidden}
  summary{padding:13px 14px; font-size:13px; color:var(--dim); cursor:pointer; list-style:none; letter-spacing:.3px}
  summary::-webkit-details-marker{display:none}
  details[open] summary{border-bottom:1px solid var(--line); color:var(--ink)}
  .adv{padding:14px}
  input[type=text]{
    width:100%; background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:10px;
    padding:12px; font:inherit; font-size:15px; outline:none;
  }
  input[type=text]:focus{border-color:var(--accent)}
  .spacer{flex:1; min-height:18px}
  .spawn{
    width:100%; padding:20px; border:none; border-radius:18px; font:inherit; font-size:19px; font-weight:700;
    letter-spacing:1px; color:#1a0f0a; cursor:pointer; transition:transform .08s, filter .15s;
    background:linear-gradient(135deg,var(--accent2),var(--accent)); box-shadow:0 10px 30px rgba(193,95,60,.35);
  }
  .spawn:active{transform:scale(.985); filter:brightness(1.08)}
  .spawn[disabled]{opacity:.5; box-shadow:none}
  .status{
    margin-top:14px; min-height:20px; font-size:14px; text-align:center; color:var(--dim);
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .status.go{color:var(--accent2)} .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  .spin{width:13px; height:13px; border:2px solid currentColor; border-top-color:transparent; border-radius:50%; animation:s .7s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .hint{margin-top:10px; font-size:12px; color:var(--dim); text-align:center; opacity:.85}
  .endless{display:flex; align-items:center; gap:13px; margin-top:16px; padding:14px; border:1px solid var(--line); border-radius:12px; background:var(--panel); cursor:pointer; user-select:none}
  .endless input{width:22px; height:22px; accent-color:var(--accent); flex:none}
  .endless b{font-weight:600; font-size:15px}
  .endless small{color:var(--dim); font-size:12px}
</style>
</head>
<body>
  <header><div class="dot"></div><h1>NEW AGENT <span>// your PC</span></h1><a class="navlink" href="__START__/agents">Agents →</a></header>

  <label for="task">Task / first message</label>
  <textarea id="task" placeholder="What should this agent do?&#10;e.g. review the open PRs in ~/myrepo and tell me the risks" autofocus></textarea>

  <div style="margin-top:14px">
    <label for="name">Agent name (optional)</label>
    <!-- autocapitalize is ON (words): this is a display name now, used exactly as typed, so the
         phone keyboard should behave like it would for any other name field. -->
    <input id="name" type="text" placeholder="auto-named from the task · used exactly as typed" autocapitalize="words" autocorrect="off" spellcheck="false" />
  </div>

  <details>
    <summary>Advanced</summary>
    <div class="adv">
      <label for="cwd">Working folder (optional)</label>
      <input id="cwd" type="text" placeholder="default: home folder" autocapitalize="off" autocorrect="off" spellcheck="false" />
    </div>
  </details>

  <label class="endless" for="solve"><input id="solve" type="checkbox" /><span><b>Solve mode</b><br><small>never gives up — spawns a fresh successor if it gets stuck, until solved</small></span></label>
  <label class="endless" for="dispatch"><input id="dispatch" type="checkbox" /><span><b>Lean dispatch</b><br><small>scope the agent to only the skills + MCP this task needs (stacks with Solve)</small></span></label>

  <div class="spacer"></div>

  <button class="spawn" id="go">START AGENT</button>
  <div class="status" id="status"></div>
  <div class="hint">opens a real Claude Code terminal on your PC · drive it there or from its chat link</div>

<script>
const SECRET = "__SECRET__";
const START = "__START__";
const $ = (id) => document.getElementById(id);
function haptic(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }
function api(p, opts={}){ return fetch(p, { ...opts, headers:{ 'Authorization':'Bearer '+SECRET, ...(opts.headers||{}) } }); }
function setStatus(t,c){ const e=$('status'); e.className='status '+(c||''); e.innerHTML=(c==='go'?'<div class="spin"></div>':'')+t; }

// Idempotency key for this press. On mobile data a request can reach the relay while its
// response is lost, which is indistinguishable from a failure — so a retry (ours below, or the
// user pressing START again) must not queue a second agent. The relay dedupes on this id, so it
// has to survive retries and only reset once a spawn actually succeeds, or the task changes.
let reqId = null;
const newReqId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));

async function start(){
  const task = $('task').value.trim();
  if (!task){ setStatus('Type a task first','err'); $('task').focus(); return; }
  const cwd = $('cwd').value.trim();
  const name = $('name').value.trim();
  const solve = $('solve').checked;
  const dispatch = $('dispatch').checked;
  if (!reqId) reqId = newReqId();
  $('go').disabled = true; haptic(20); setStatus(solve?(dispatch?'Starting a lean Solve relay…':'Starting Solve relay on your PC…'):(dispatch?'Opening a lean scoped terminal…':'Opening a terminal on your PC…'),'go');
  const path = solve ? '/solve/new' : '/spawn';
  const body = JSON.stringify(solve ? { goal: task, cwd, dispatch, reqId, name } : { task, cwd, dispatch, reqId, name });
  try{
    let r;
    try {
      r = await api(path, { method:'POST', headers:{'Content-Type':'application/json'}, body });
    } catch(netErr) {
      // Dropped connection, not a rejection. Retrying is safe now that reqId dedupes it.
      setStatus('Connection dropped · retrying…','go');
      await new Promise(res => setTimeout(res, 1500));
      r = await api(path, { method:'POST', headers:{'Content-Type':'application/json'}, body });
    }
    if (!r.ok) throw new Error('relay '+r.status);
    const j = await r.json().catch(()=>({}));
    reqId = null; // this press is spent; the next one is a new agent
    haptic([15,40,15]);
    // Names are shown exactly as typed. Solve also shows its id, because that (not the title) is
    // what its terminal tabs are named — sv<squashed>-g<N>, forced by the reapers' regex.
    const esc = (t)=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const solveAs = j.title ? (' as '+esc(j.title)+(j.id?' ('+esc(j.id)+')':'')) : (j.id?' as '+esc(j.id):'');
    setStatus(solve?('Solve relay started'+solveAs+' · it keeps going until solved'):('Terminal opening'+(j.name?' as '+esc(j.name):'')+' · appears in Agents with its chat link'),'ok');
    setTimeout(()=>{ location.href = START + '/agents'; }, 1500);
  } catch(e){ setStatus('Could not reach relay ('+e.message+') · press again, it will not double-start','err'); $('go').disabled = false; }
}
$('go').addEventListener('click', start);
// A different task (or name) is a different agent, so it must not reuse the previous press's key.
$('task').addEventListener('input', ()=>{ reqId = null; });
$('name').addEventListener('input', ()=>{ reqId = null; });
</script>
</body>
</html>
